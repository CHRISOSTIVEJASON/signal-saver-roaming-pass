name: Build Global Networks APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_APP_URL: ${{ vars.CAPACITOR_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Require published app URL
        run: |
          test -n "$CAPACITOR_APP_URL" || { echo 'Set repository variable CAPACITOR_APP_URL to your published HTTPS app URL.'; exit 1; }
      - run: bun install --frozen-lockfile
      - run: node node_modules/@capacitor/cli/bin/capacitor sync android
      - name: Compile installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: global-networks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
