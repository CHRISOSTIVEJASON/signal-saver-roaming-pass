name: Build Global Networks APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_APP_URL: ${{ vars.CAPACITOR_APP_URL || 'https://signal-saver-roaming-pass.lovable.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: node node_modules/@capacitor/cli/bin/capacitor sync android
      - name: Setup native tun2socks engine (hev-socks5-tunnel JNI libraries)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86
          mkdir -p android/app/src/main/jniLibs/x86_64
          curl -sSL -o android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so https://raw.githubusercontent.com/J1BON/ProxyTunnel/main/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          curl -sSL -o android/app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so https://raw.githubusercontent.com/J1BON/ProxyTunnel/main/app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so
          curl -sSL -o android/app/src/main/jniLibs/x86/libhev-socks5-tunnel.so https://raw.githubusercontent.com/J1BON/ProxyTunnel/main/app/src/main/jniLibs/x86/libhev-socks5-tunnel.so
          curl -sSL -o android/app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so https://raw.githubusercontent.com/J1BON/ProxyTunnel/main/app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so
          echo "Native JNI libraries installed:"
          ls -l android/app/src/main/jniLibs/*
      - name: Compile installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: global-networks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: Global Networks APK (Latest)
          body: |
            ### Global Networks Android APK
            Native TUN engine (hev-socks5-tunnel / lwIP) + SOCKS5 UDP ASSOCIATE dual-path tunnel build.
            - Direct APK download link: [Download app-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest-apk/app-debug.apk)
          files: android/app/build/outputs/apk/debug/app-debug.apk
