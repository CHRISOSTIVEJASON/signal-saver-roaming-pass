name: Build Global Networks APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_APP_URL: ${{ vars.CAPACITOR_APP_URL || 'https://signal-saver-roaming-pass.lovable.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: node node_modules/@capacitor/cli/bin/capacitor sync android
      - name: Compile installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: global-networks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: Global Networks APK (Latest)
          body: |
            ### Global Networks Android APK
            Automated zero-touch relay routing and client auto-tunneling build.
            - Direct APK download link: [Download app-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest-apk/app-debug.apk)
          files: android/app/build/outputs/apk/debug/app-debug.apk
